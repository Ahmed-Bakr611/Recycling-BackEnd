paths:
  /orders:
    post:
      summary: Create a new order
      description: |
        Allows an authenticated user (customer, buyer, or admin) to create a new order.  
        If the user is a buyer, item quantities will be decreased.
      tags:
        - Orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
                - items
                - phoneNumber
                - userName
              properties:
                address:
                  type: string
                phoneNumber:
                  type: string
                userName:
                  type: string
                email:
                  type: string
                imageUrl:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - categoryId
                      - itemName
                      - image
                      - measurement_unit
                      - points
                      - price
                      - quantity
                    properties:
                      _id:
                        type: string
                        description: Item ID (required if buyer)
                        example: "64f23aab31cabc0e62db92e1"
                      categoryId:
                        type: string
                        description: ID of the category
                      itemName:
                        type: string
                      image:
                        type: string
                      measurement_unit:
                        type: integer
                        enum: [1, 2]
                        description: 1 = KG, 2 = PIECE (example)
                      points:
                        type: number
                      price:
                        type: number
                      quantity:
                        type: number
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Order created successfully
                  data:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Missing required fields or invalid input
        "403":
          description: Forbidden – user lacks permission
        "404":
          description: User not found
        "500":
          description: Internal server error
    get:
      summary: Get all orders for the authenticated user
      description: |
        Retrieves all orders created by the authenticated user, sorted by creation date (most recent first).  
        Only accessible by roles: `customer`, `buyer`, and `admin`.
      tags:
        - Orders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successfully retrieved orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 3
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          description: Unauthorized – token missing or invalid
        "403":
          description: Forbidden – user lacks permission
        "500":
          description: Internal server error

components:
  schemas:
    Order:
      type: object
      properties:
        _id:
          type: string
        user:
          type: object
          properties:
            userId:
              type: string
            phoneNumber:
              type: string
            userName:
              type: string
            email:
              type: string
        address:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              itemName:
                type: string
              image:
                type: string
              measurement_unit:
                type: integer
              points:
                type: number
              price:
                type: number
              quantity:
                type: number
              categoryId:
                type: string
              categoryName:
                type: string
        status:
          type: string
          example: pending
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
